name: Refresh raw document badge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raw-document-badge
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out machine data
        uses: actions/checkout@v7

      - name: Count raw documents
        id: corpus
        shell: bash
        run: |
          count="$(
            git ls-files -- '*.txt' '*.tsv' \
              ':(exclude).state/**' \
              ':(exclude)media-manifest.tsv' |
              wc -l |
              tr -d ' '
          )"
          test "$count" -gt 0
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Update badge endpoint
        env:
          RAW_DOCUMENT_COUNT: ${{ steps.corpus.outputs.count }}
        shell: bash
        run: |
          jq -n --arg message "$RAW_DOCUMENT_COUNT" '{
            schemaVersion: 1,
            label: "raw documents",
            message: $message,
            color: "111111"
          }' > .github/badges/raw-documents.json

      - name: Publish changed count
        shell: bash
        run: |
          if git diff --quiet -- .github/badges/raw-documents.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/raw-documents.json
          git commit -m "Update raw document count"
          git push
