name: Request graph builder rebuild (manual only)

on:
  # machine-data publishes continuously; graph production builds are nightly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-builder-rebuild-request
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Send rebuild request
        env:
          GH_TOKEN: ${{ secrets.GRAPH_BUILDER_DISPATCH_TOKEN }}
        shell: bash
        run: |
          gh api \
            --method POST \
            repos/ufo-files/relationship-graph-builder/actions/workflows/rebuild-graph.yml/dispatches \
            --field ref=main
