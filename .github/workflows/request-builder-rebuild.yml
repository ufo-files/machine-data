name: Request graph builder rebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-builder-rebuild-request
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Send rebuild request
        env:
          GH_TOKEN: ${{ secrets.GRAPH_BUILDER_DISPATCH_TOKEN }}
          MACHINE_DATA_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          gh api \
            --method POST \
            repos/ufo-files/relationship-graph-builder/dispatches \
            --field event_type=machine-data-updated \
            --field "client_payload[revision]=$MACHINE_DATA_REVISION"
